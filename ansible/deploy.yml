---
- name: Deploy Temperature Sensor to Raspberry Pi
  hosts: pi_sensors
  become: yes
  
  vars:
    app_name: temperature-sensor
    app_dir: /opt/{{ app_name }}
    service_user: sensor
    
    # MQTT Configuration (use Ansible Vault for production)
    mqtt_server: "{{ vault_mqtt_server | default('homeassistant.local') }}"
    mqtt_username: "{{ vault_mqtt_username }}"
    mqtt_password: "{{ vault_mqtt_password }}"
    
  tasks:
    - name: Update package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install required system packages
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - git
          - docker.io
          - docker-compose
        state: present
    
    - name: Create service user
      user:
        name: "{{ service_user }}"
        system: yes
        shell: /bin/bash
        home: "{{ app_dir }}"
        create_home: yes
    
    - name: Add service user to docker group
      user:
        name: "{{ service_user }}"
        groups: docker
        append: yes
    
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: '0755'
    
    - name: Copy application files
      synchronize:
        src: ../
        dest: "{{ app_dir }}/"
        delete: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"
          - "--exclude=ansible"
      become_user: "{{ service_user }}"
    
    - name: Create environment file
      template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: '0600'
    
    - name: Build Docker image
      docker_image:
        name: "{{ app_name }}"
        source: build
        build:
          path: "{{ app_dir }}"
          pull: yes
        state: present
      become_user: "{{ service_user }}"
    
    - name: Create systemd service file
      template:
        src: systemd.service.j2
        dest: /etc/systemd/system/{{ app_name }}.service
        mode: '0644'
      notify: reload systemd
    
    - name: Enable and start service
      systemd:
        name: "{{ app_name }}"
        enabled: yes
        state: started
        daemon_reload: yes
  
  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
